<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Джарвис</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --line: #232c3f; --text: #e6ebf5; --muted: #8a95ad;
    --idle: #5b6b8c; --listen: #3b9cff; --exec: #f5b83d; --ok: #3ccf7e; --bad: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .04em; }
  #conn { margin-left: auto; font-size: 12px; color: var(--muted); }
  #conn::before { content: "●"; margin-right: 6px; color: var(--bad); }
  #conn.on::before { color: var(--ok); }

  .core { display: flex; align-items: center; gap: 22px; background: var(--panel);
          border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .orb { flex: none; width: 92px; height: 92px; border-radius: 50%; position: relative;
         background: radial-gradient(circle at 50% 45%, var(--c) 0%, transparent 70%);
         box-shadow: 0 0 calc(10px + var(--glow, 0px)) var(--c); --c: var(--idle);
         transition: box-shadow .08s linear, background .3s; }
  .orb::after { content: ""; position: absolute; inset: 10px; border-radius: 50%;
                border: 2px solid var(--c); opacity: .7; }
  .orb.listening, .orb.recognizing { --c: var(--listen); animation: pulse 1.2s infinite; }
  .orb.executing { --c: var(--exec); animation: pulse .6s infinite; }
  .orb.ok { --c: var(--ok); } .orb.bad, .orb.error { --c: var(--bad); }
  .orb.paused { --c: #444c5e; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .status { min-width: 0; flex: 1; }
  #stateLabel { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  #stateText { font-size: 20px; font-weight: 600; margin: 4px 0 12px; overflow-wrap: anywhere; }
  .meter { height: 8px; background: #1b2336; border-radius: 4px; overflow: hidden; }
  #level { height: 100%; width: 0; background: linear-gradient(90deg, var(--listen), var(--ok), var(--exec));
           transition: width .08s linear; }
  .meterlabel { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .row { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
  input { flex: 1; min-width: 180px; background: var(--panel); color: var(--text); border: 1px solid var(--line);
          border-radius: 10px; padding: 11px 13px; font: inherit; }
  button { background: #1d263b; color: var(--text); border: 1px solid var(--line); border-radius: 10px;
           padding: 11px 15px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--listen); }
  button.primary { background: var(--listen); border-color: var(--listen); color: #04101f; font-weight: 600; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 24px 0 8px; }
  #log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #log li { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line);
            border-left: 3px solid var(--idle); border-radius: 8px; padding: 9px 12px; }
  #log li.heard { border-left-color: var(--listen); }
  #log li.say { border-left-color: #9a7bff; }
  #log li.ok { border-left-color: var(--ok); } #log li.bad { border-left-color: var(--bad); }
  #log li.clap { border-left-color: var(--exec); }
  #log .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; flex: none; }
  #log .k { color: var(--muted); font-size: 12px; width: 62px; flex: none; padding-top: 2px; }
  #log .x { overflow-wrap: anywhere; }
  .help { font-size: 13px; color: var(--muted); }
  .help code { color: var(--text); background: #1b2336; padding: 1px 6px; border-radius: 5px; }
  #cmds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #cmds span { font-size: 12px; background: #1b2336; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  @media (max-width: 520px) { .core { flex-direction: column; text-align: center; } }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>ДЖАРВИС</h1><span id="conn">няма връзка</span></header>

  <section class="core">
    <div id="orb" class="orb"></div>
    <div class="status">
      <div id="stateLabel">стартиране</div>
      <div id="stateText">…</div>
      <div class="meter"><div id="level"></div></div>
      <div class="meterlabel">Микрофон: ако лентата мърда, когато говориш, Джарвис те чува.</div>
    </div>
  </section>

  <form class="row" id="form">
    <input id="cmd" placeholder="Напиши команда…" autocomplete="off">
    <button class="primary">Изпълни</button>
    <button type="button" id="routine">Сутрешна рутина</button>
    <button type="button" id="pause">Пауза</button>
  </form>

  <p class="help">Кажи <code id="hw">Джарвис</code> … команда … <code id="he">край</code>. Командите (натисни, за да пробваш):</p>
  <div id="cmds"></div>

  <h2>Какво се случва</h2>
  <ul id="log"></ul>
</div>
<script>
const $ = id => document.getElementById(id);
const LABELS = { idle: "чакам", listening: "слушам", recognizing: "разпознавам", executing: "изпълнявам",
                 paused: "пауза", error: "грешка", starting: "стартиране", ok: "готово", bad: "неуспех" };
const KINDS = { heard: "чух", say: "отговор", result: "резултат", clap: "пляскане", info: "инфо" };
let paused = false, flashTimer;

function setState(state, text) {
  $("orb").className = "orb " + state;
  $("stateLabel").textContent = LABELS[state] || state;
  if (text !== undefined) $("stateText").textContent = text;
}
function addLog(ev) {
  const li = document.createElement("li");
  let cls = ev.kind;
  if (ev.kind === "result") cls = ev.ok ? "ok" : "bad";
  li.className = cls;
  const text = ev.kind === "clap" ? "👏👏 Двойно пляскане" : ev.text;
  li.innerHTML = `<span class="t"></span><span class="k"></span><span class="x"></span>`;
  li.children[0].textContent = ev.time || "";
  li.children[1].textContent = KINDS[ev.kind] || ev.kind;
  li.children[2].textContent = text;
  $("log").prepend(li);
  while ($("log").children.length > 80) $("log").lastChild.remove();
}
function handle(ev) {
  if (ev.kind === "level") {
    const v = Math.min(1, ev.value * 2.5);
    $("level").style.width = (v * 100) + "%";
    $("orb").style.setProperty("--glow", (v * 40) + "px");
    return;
  }
  if (ev.kind === "status") { clearTimeout(flashTimer); return setState(ev.state, ev.text); }
  addLog(ev);
  if (ev.kind === "result") {
    setState(ev.ok ? "ok" : "bad", ev.text);
    clearTimeout(flashTimer);
  }
}
function connect() {
  const es = new EventSource("/events");
  es.onopen = () => { $("conn").textContent = "свързан"; $("conn").className = "on"; };
  es.onmessage = m => handle(JSON.parse(m.data));
  es.onerror = () => { $("conn").textContent = "няма връзка — Джарвис спрян ли е?"; $("conn").className = "";
                       setState("error", "Няма връзка с Джарвис"); };
}
const post = body => fetch("/action", { method: "POST", body: JSON.stringify(body) });
$("form").onsubmit = e => { e.preventDefault(); const t = $("cmd").value.trim();
  if (t) { post({ action: "command", text: t }); $("cmd").value = ""; } };
$("routine").onclick = () => post({ action: "routine" });
$("pause").onclick = () => { paused = !paused; post({ action: paused ? "pause" : "resume" });
  $("pause").textContent = paused ? "Продължи" : "Пауза"; };
fetch("/config").then(r => r.json()).then(c => {
  $("hw").textContent = c.wake[0].toUpperCase() + c.wake.slice(1); $("he").textContent = c.end;
  for (const name of c.commands) { const s = document.createElement("span"); s.textContent = name;
    s.onclick = () => { $("cmd").value = name; $("cmd").focus(); }; $("cmds").append(s); }
}).catch(() => {});
connect();
</script>
</body>
</html>
