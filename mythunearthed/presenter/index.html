<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = 900, H = 1200;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// ---------- lights (soft studio) ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0xcdbda4, 1.7));
const key = new THREE.DirectionalLight(0xfff0dd, 1.5); key.position.set(2.5, 4, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xdbe6ff, 0.5); fill.position.set(-3, 2, 3); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.9); rim.position.set(-1.5, 3, -3); scene.add(rim);

// ---------- helpers ----------
const M = (c, r = 0.85) => new THREE.MeshLambertMaterial({ color: c, side: THREE.DoubleSide }) /* Lambert: ~6x faster than PBR on software GL */;
const C = {
  skin: 0xf0bd96, skinD: 0xe3a37c, hair: 0x4a2e1d, hat: 0xcfb074, band: 0x7b5232,
  shirt: 0xe2d2a0, vest: 0x6a6b3c, leather: 0x7d4a22, strap: 0x65391a, pants: 0x232d52, boot: 0x4a2c1a,
  dark: 0x2a1a17, mouth: 0x4b1818, brass: 0xd0a040,
};
function mesh(geo, mat, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); return m;
}
const sph = (r, mat, x, y, z, sx = 1, sy = 1, sz = 1) => mesh(new THREE.SphereGeometry(r, 32, 20), mat, x, y, z, sx, sy, sz);
const cap = (r, len, mat, x, y, z) => mesh(new THREE.CapsuleGeometry(r, len, 8, 20), mat, x, y, z);
function placeOnSphere(obj, x, y, R, off) {
  const z = Math.sqrt(Math.max(R * R - x * x - y * y, 1e-6));
  const n = new THREE.Vector3(x, y, z).normalize();
  obj.position.copy(n).multiplyScalar(R + off);
  obj.lookAt(obj.position.clone().multiplyScalar(2));
}

// ---------- character ----------
const root = new THREE.Group(); scene.add(root);
const body = new THREE.Group(); root.add(body);
const HIP = 0.84;

// shadow
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d'); const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(0,0,0,0.42)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  sh.rotation.x = -Math.PI / 2; sh.position.set(0, 0.003, 0.03); sh.scale.set(0.95, 0.55, 1); sh.renderOrder = -1;
  root.add(sh);
}

// pelvis + legs
body.add(sph(0.2, M(C.pants), 0, HIP, 0, 1, 0.62, 0.8));
const legs = [];
for (const s of [1, -1]) {
  const piv = new THREE.Group(); piv.position.set(s * 0.093, HIP + 0.02, 0); body.add(piv);
  piv.add(cap(0.084, 0.62, M(C.pants), 0, -0.385, 0));
  const boot = new THREE.Group(); boot.position.set(0, -0.8, 0); piv.add(boot);
  boot.add(sph(0.1, M(C.boot, 0.7), 0, 0.0, 0.04, 1, 0.68, 1.5));
  boot.add(sph(0.085, M(C.boot, 0.7), 0, 0.03, -0.01, 1, 0.9, 1.0));
  legs.push(piv);
}

// torso
const torso = new THREE.Group(); torso.position.set(0, HIP, 0); body.add(torso);
const torsoShell = new THREE.Group(); torso.add(torsoShell); torsoShell.position.y = 0.3;
torsoShell.add(mesh(new THREE.CapsuleGeometry(0.19, 0.26, 8, 28), M(C.shirt), 0, 0, 0, 1, 1, 0.8));
torsoShell.add(mesh(new THREE.CapsuleGeometry(0.2, 0.25, 8, 28), M(C.vest), 0, -0.01, 0, 1, 0.97, 0.84));
torsoShell.add(mesh(new THREE.CapsuleGeometry(0.032, 0.4, 6, 12), M(C.shirt), 0, 0.03, 0.162, 1, 1, 0.45));
// collar + belt
torsoShell.add(mesh(new THREE.TorusGeometry(0.075, 0.02, 10, 24), M(C.shirt), 0, 0.31, 0.01, 1, 1, 1.1).rotateX(Math.PI / 2));
torsoShell.add(mesh(new THREE.TorusGeometry(0.2, 0.017, 8, 40), M(C.leather), 0, -0.28, 0, 1, 1, 0.84).rotateX(Math.PI / 2));
// satchel strap (diagonal ring) + bag
{
  const pts = []; const y0 = 1.2 - HIP - 0.3;
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * Math.PI * 2; const x = 0.216 * Math.cos(a), z = 0.192 * Math.sin(a);
    pts.push(new THREE.Vector3(x, y0 + 0.85 * x, z));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 96, 0.017, 8, true), M(C.strap, 0.7));
  tube.scale.set(1, 1, 1); torsoShell.add(tube);
  const bag = new THREE.Group(); bag.position.set(-0.262, 0.93 - HIP - 0.3, 0.02); bag.rotation.z = 0.1; bag.rotation.y = -0.15; torsoShell.add(bag);
  bag.add(new THREE.Mesh(new RoundedBoxGeometry(0.2, 0.17, 0.085, 4, 0.025), M(C.leather, 0.7)));
  bag.add(mesh(new RoundedBoxGeometry(0.205, 0.085, 0.092, 4, 0.025), M(C.strap, 0.7), 0, 0.045, 0));
  bag.add(sph(0.016, M(C.brass, 0.4), 0, 0.01, 0.052));
}

// neck
torso.add(mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.12, 20), M(C.skin), 0, 0.63, 0));

// head
const headPivot = new THREE.Group(); headPivot.position.set(0, 0.63 + 0.0, 0); torso.add(headPivot);
const headC = new THREE.Group(); headC.position.set(0, 0.14, 0); headPivot.add(headC);
const R = 0.2;
headC.add(sph(R, M(C.skin, 0.75), 0, 0, 0));
for (const s of [1, -1]) headC.add(sph(0.032, M(C.skin), s * 0.197, -0.045, 0.005, 0.6, 1, 0.9));
// hair: back/side shell
headC.add(mesh(new THREE.SphereGeometry(0.207, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.62), M(C.hair, 0.9), 0, 0.005, -0.04));
// eyes
const eyes = [];
for (const s of [1, -1]) {
  const g = new THREE.Group(); placeOnSphere(g, s * 0.075, 0.005, R, -0.001); headC.add(g);
  g.add(sph(0.025, M(C.dark, 0.4), 0, 0, 0, 1, 1.15, 0.5));
  g.add(sph(0.0075, new THREE.MeshBasicMaterial({ color: 0xffffff }), 0.008, 0.011, 0.011));
  eyes.push(g);
}
// brows
const brows = [];
for (const s of [1, -1]) {
  const g = new THREE.Group(); headC.add(g);
  const c = mesh(new THREE.CapsuleGeometry(0.0095, 0.05, 6, 12), M(C.hair, 0.8)); c.rotation.z = Math.PI / 2; g.add(c);
  brows.push({ g, c, s });
}
// nose + mouth
{
  const n = sph(0.033, M(C.skinD, 0.7), 0, 0, 0, 1, 0.9, 0.95); placeOnSphere(n, 0, -0.035, R, 0.006); headC.add(n);
}
const mouthG = new THREE.Group(); headC.add(mouthG);
const mouthIn = mesh(new THREE.SphereGeometry(1, 24, 16), M(C.mouth, 0.5)); mouthG.add(mouthIn);
const tongue = mesh(new THREE.SphereGeometry(1, 16, 12), M(0xc4585a, 0.5)); mouthG.add(tongue);
const smileArc = Math.PI * 0.7;
const smile = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.0065, 8, 24, smileArc), M(C.mouth, 0.5));
smile.rotation.z = -Math.PI / 2 - smileArc / 2; smile.position.y = 0.034; mouthG.add(smile);
{ const cheeks = []; }

// hat
const hatG = new THREE.Group(); headC.add(hatG); hatG.rotation.x = -0.2;
const lathe = (pts, mat) => new THREE.Mesh(new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), 56), mat);
const hatM = M(C.hat, 0.9);
hatG.add(lathe([[0.15, 0.15], [0.3, 0.148], [0.34, 0.158], [0.352, 0.172], [0.34, 0.186], [0.3, 0.178], [0.15, 0.18]], hatM));
hatG.add(lathe([[0.176, 0.15], [0.18, 0.2], [0.172, 0.262], [0.15, 0.305], [0.11, 0.33], [0.05, 0.34], [0.0, 0.342]], hatM));
hatG.add(lathe([[0.176, 0.178], [0.186, 0.18], [0.186, 0.222], [0.176, 0.224]], M(C.band, 0.8)));

// arms
const arms = [];
for (const s of [1, -1]) {
  const sh = new THREE.Group(); sh.position.set(s * 0.205, 0.53, 0); torso.add(sh);
  sh.add(sph(0.062, M(C.shirt), 0, 0, 0));
  sh.add(cap(0.052, 0.16, M(C.shirt), 0, -0.135, 0));
  const el = new THREE.Group(); el.position.y = -0.265; sh.add(el);
  el.add(sph(0.05, M(C.shirt), 0, 0, 0));
  el.add(cap(0.047, 0.14, M(C.shirt), 0, -0.125, 0));
  const hd = new THREE.Group(); hd.position.y = -0.255; el.add(hd);
  hd.add(sph(0.056, M(C.skin, 0.7), 0, -0.04, 0, 1.0, 1.2, 0.85));
  hd.add(sph(0.024, M(C.skin, 0.7), -s * 0.046, -0.035, 0.03));
  const fg = new THREE.Group(); fg.position.set(0, -0.07, 0.0); hd.add(fg);
  fg.add(cap(0.015, 0.06, M(C.skin, 0.7), 0, -0.045, 0));
  arms.push({ sh, el, fg, s });
}

// ---------- animation ----------
const BASE = {
  aShX: 0, aShZ: 0.1, aElX: -0.3, aElZ: 0.05, bShX: 0, bShZ: 0.1, bElX: -0.3, bElZ: 0.05,
  headYaw: 0, headPitch: 0, headRoll: 0, brow: 0, mouthMin: 0, bodyYaw: 0, lean: 0, shrugY: 0,
  fingerA: 0, fingerB: 0, eyeWide: 0, walk: 0, hop: 0, smile: 0.3,
};
const ACT = {
  idle: () => ({}),
  wave: (t) => ({ aShX: -0.3, aShZ: 1.3, aElX: 0, aElZ: 1.5 + 0.32 * Math.sin(t * 2 * Math.PI * 2.4), headYaw: 0.12, headRoll: -0.06, brow: 0.35, mouthMin: 0.12, bodyYaw: -0.05, smile: 1 }),
  point_right: () => ({ aShX: -0.45, aShZ: 1.2, aElX: -0.1, aElZ: 0.25, fingerA: 1, headYaw: 0.5, headPitch: -0.03, bodyYaw: -0.12, brow: 0.2 }),
  point_left: () => ({ bShX: -0.45, bShZ: 1.2, bElX: -0.1, bElZ: 0.25, fingerB: 1, headYaw: -0.6, headPitch: -0.03, bodyYaw: -0.3, brow: 0.2 }),
  shrug: () => ({ aShZ: 0.5, aElZ: 1.05, aElX: -0.55, bShZ: 0.5, bElZ: 1.05, bElX: -0.55, shrugY: 0.04, headRoll: 0.13, brow: 0.6, headPitch: 0.03, smile: 0 }),
  walk: () => ({ walk: 1, aElX: -0.7, bElX: -0.7, bodyYaw: -0.1 }),
  surprised: (t, u) => ({ brow: 1, eyeWide: 1, mouthMin: 0.7, headPitch: -0.1, lean: -0.05, hop: 1, aShZ: 0.55, aElX: -0.9, aElZ: 0.3, bShZ: 0.55, bElX: -0.9, bElZ: 0.3, smile: 0 }),
  nod: (t, u) => ({ headPitch: 0.17 * Math.sin(u * Math.PI * 4) }),
};
const ss = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const RAMP = 0.25;
let TL, NF;
const blinkTimes = []; for (let k = 0; k < 400; k++) blinkTimes.push(1.9 + k * 3.3 + 0.7 * Math.sin(k * 12.9) + (k % 5 === 3 ? 0.35 : 0));

function pose(t, f) {
  const P = Object.assign({}, BASE);
  for (const a of TL.actions) {
    const w = ss((t - a.t) / RAMP) * ss((a.t + a.d - t) / RAMP);
    if (w <= 0) continue;
    const tgt = (ACT[a.type] || ACT.idle)(t, (t - a.t) / a.d);
    for (const k in tgt) P[k] += w * (tgt[k] - BASE[k]) * (k === 'headPitch' && a.type === 'nod' ? 1 : 1);
    if (a.type === 'nod') { /* nod target is a delta from base 0 */ }
  }
  return P;
}

function setup(timeline) {
  TL = timeline; TL.actions = TL.actions || [];
  NF = Math.max(1, Math.round(TL.duration * TL.fps));
  const half = TL.camera === 'half';
  const fov = 28, vis = half ? 2.0 : 2.2, cy = half ? 1.24 : 0.98;
  const cam = new THREE.PerspectiveCamera(fov, W / H, 0.1, 50);
  const d = (vis / 2) / Math.tan(THREE.MathUtils.degToRad(fov / 2));
  const cx = half ? 0.24 : 0; cam.position.set(cx, cy + (half ? 0.1 : 0.15), d); cam.lookAt(cx, cy, 0);
  window.cam = cam;
  return NF;
}

function mouthAt(i) { const m = TL.mouth; if (!m || !m.length) return 0; return m[Math.min(m.length - 1, Math.max(0, i))] || 0; }

function frame(i) {
  const t = i / TL.fps;
  const P = pose(t, i);
  // talking energy: smoothed mouth envelope
  let talk = 0, n = 0; for (let k = -6; k <= 6; k++) { talk += mouthAt(i + k); n++; } talk = Math.min(1, (talk / n) * 2.2);
  const mouth = Math.min(1, Math.max(mouthAt(i), P.mouthMin));
  const br = Math.sin(t * 2 * Math.PI / 3.4);

  // body
  const swing = Math.sin(t * 2 * Math.PI * 1.0) * P.walk;
  const bounce = P.walk * 0.025 * (1 - Math.cos(2 * t * 2 * Math.PI * 1.0)) * 0.5;
  const hopV = P.hop * 0.012 * (1 + Math.sin(t * 9));
  body.position.y = bounce + hopV;
  body.rotation.y = 0.32 + P.bodyYaw + 0.07 * swing + 0.015 * Math.sin(t * 2 * Math.PI * 0.21) + 0.02 * talk * Math.sin(t * 2 * Math.PI * 0.6);
  body.rotation.z = 0.012 * Math.sin(t * 2 * Math.PI * 0.27) + 0.015 * swing;
  torso.rotation.x = P.lean + 0.008 * br;
  torsoShell.scale.set(1 + 0.006 * br, 1 + 0.014 * br, 1 + 0.01 * br);

  legs[0].rotation.x = -0.55 * swing; legs[1].rotation.x = 0.55 * swing;
  legs[0].position.y = HIP + 0.02 + 0.03 * Math.max(0, -Math.sin(t * 2 * Math.PI * 1.0 + 0)) * P.walk * (swing < 0 ? 0 : 0) + 0.035 * P.walk * Math.max(0, -swing);
  legs[1].position.y = HIP + 0.02 + 0.035 * P.walk * Math.max(0, swing);

  // head
  const idleYaw = 0.03 * Math.sin(t * 2 * Math.PI * 0.23) , idlePitch = 0.015 * Math.sin(t * 2 * Math.PI * 0.31 + 1);
  const tYaw = talk * (0.07 * Math.sin(t * 2 * Math.PI * 0.55 + 1) + 0.035 * Math.sin(t * 2 * Math.PI * 1.35));
  const tPitch = talk * (0.04 * Math.sin(t * 2 * Math.PI * 0.85 + 2) + 0.05 * (mouthAt(i) - 0.3)) ;
  const tRoll = talk * 0.03 * Math.sin(t * 2 * Math.PI * 0.45);
  headPivot.rotation.set(P.headPitch + idlePitch + tPitch, P.headYaw + idleYaw + tYaw, P.headRoll + tRoll, 'YXZ');

  // face
  let blink = 0; for (const bt of blinkTimes) { const dd = Math.abs(t - bt) / 0.085; if (dd < 1) { blink = 1 - dd; break; } if (bt > t + 1) break; }
  const ew = 1 + 0.22 * P.eyeWide;
  for (const e of eyes) e.scale.set(ew, ew * (1 - 0.92 * blink), 1);
  for (const b of brows) {
    const y = 0.078 + 0.036 * P.brow;
    placeOnSphere(b.g, b.s * 0.075, y, R, 0.003);
    b.c.rotation.z = Math.PI / 2 + 0; b.g.rotation.z += 0;
    b.g.rotateZ(b.s * (-0.05 + 0.15 * P.brow));
  }
  const open = mouth;
  const mw = 0.05 * (1 - 0.3 * open) * (1 + 0.1 * P.smile * (1 - open));
  const mh = 0.004 + 0.052 * open;
  placeOnSphere(mouthG, 0, -0.085 - 0.012 * open, R, 0.0);
  mouthIn.scale.set(mw, mh, 0.012); mouthIn.visible = open > 0.03;
  tongue.scale.set(mw * 0.62, mh * 0.45, 0.01); tongue.position.set(0, -mh * 0.45, 0.003); tongue.visible = open > 0.25;
  const sm = Math.max(0, 1 - open * 7);
  smile.visible = sm > 0.05; smile.scale.set(0.8 + 0.5 * P.smile, 0.6 + 0.6 * P.smile, 1); smile.position.y = 0.034 + 0.002 * P.smile;

  // arms
  const talkA = talk * 0.06 * Math.sin(t * 2 * Math.PI * 1.1);
  const talkB = talk * 0.05 * Math.sin(t * 2 * Math.PI * 0.9 + 1.5);
  const idleA = 0.025 * br;
  const set = (A, shX, shZ, elX, elZ, fin, walkSgn, extra) => {
    A.sh.rotation.set(shX + walkSgn * 0.5 * swing + extra, 0, A.s * (shZ + idleA), 'XYZ');
    A.el.rotation.set(elX, 0, A.s * elZ, 'XYZ');
    A.fg.scale.set(1, Math.max(0.001, fin), 1); A.fg.visible = fin > 0.02;
    A.sh.position.y = 0.53 + P.shrugY + 0.004 * br;
  };
  set(arms[0], P.aShX, P.aShZ, P.aElX, P.aElZ, P.fingerA, 1, talkA);
  set(arms[1], P.bShX, P.bShZ, P.bElX, P.bElZ, P.fingerB, -1, talkB);
  // when talking, gentle forearm lift on free arm
  if (talk > 0 && P.fingerB < 0.5) arms[1].el.rotation.x -= 0.15 * talk * (0.5 + 0.5 * Math.sin(t * 2 * Math.PI * 0.8));
}

window.setup = setup;
window.renderFrame = (i) => {
  const t0 = performance.now();
  frame(i);
  renderer.render(scene, window.cam);
  const gl = renderer.getContext(); gl.finish();
  const t1 = performance.now();
  const u = renderer.domElement.toDataURL('image/png');
  window.__t = [t1 - t0, performance.now() - t1];
  return u;
};
window.READY = true;
</script></body></html>
